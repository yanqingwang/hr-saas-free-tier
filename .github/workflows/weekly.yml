name: weekly hr-saas free-tier scan

on:
  schedule:
    - cron: "30 1 * * 1"     # 每周一 01:30 UTC（北京 09:30）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hr-saas-free-tier-refresh
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests markdown
      - name: Probe links & build report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python -m src.main --mail
      - name: Commit snapshot
        run: |
          git config user.name "hr-saas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "weekly hr-saas scan $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
          fi
